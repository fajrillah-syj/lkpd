<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Latihan JavaScript Dasar</title>
</head>
<body>
  <h1>Hasil Latihan JavaScript</h1>
  <script>// Meminta pengguna memasukkan nilai
let nilai = prompt("Masukkan nilai Anda (angka):");

// Mengubah input string menjadi angka
let angka = parseInt(nilai);

// Melakukan percabangan if-else untuk menentukan kelulusan
if (angka >= 70) {
    // Jika nilai 70 atau lebih
    alert("SELAMAT! Anda LULUS.");
} else {
    // Jika nilai kurang dari 70
    alert("MAAF, Anda TIDAK LULUS.");
}

// Catatan: Kode ini akan berjalan di lingkungan browser/Node.js yang mendukung 'prompt' dan 'alert'.</script>
  </script>
</body>
</html>
