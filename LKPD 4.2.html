<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Latihan JavaScript Dasar</title>
</head>
<body>
  <h1>Hasil Latihan JavaScript</h1>
    <script>
    /**
 * Fungsi untuk menampilkan sapaan ke pengguna.
 * Fungsi ini tidak membutuhkan parameter dan tidak mengembalikan nilai (hanya menjalankan aksi).
 */
function sapa() {
    console.log("Halo! Selamat datang di LKPD Fungsi JavaScript.");
    alert("Semangat Belajar!");
}

// Contoh Penggunaan:
sapa(); 
// Akan menampilkan teks di console dan pop-up alert di browser/lingkungan yang mendukung.
    </script>
</body>
</html>
