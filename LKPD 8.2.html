<!DOCTYPE html>
<html>
<head>
    <title>Latihan 2 - Feedback Langsung</title>
</head>
<body>

    <h3>Form Pendaftaran Sederhana</h3>
    <label for="nama">Nama lengkap</label><br>
    <input type="text" id="nama" placeholder="Nama lengkap"><br>

    <label for="email">Email</label><br>
    <input type="email" id="email" placeholder="email@contoh.com"><br>

    <label for="password">Kata sandi</label><br>
    <input type="password" id="password" placeholder="Kata sandi"><br>

    <button type="button" onclick="validasi()">Daftar</button>

    <p id="feedback" style="color: red; margin-top: 10px;"></p>

    <script>
        function validasi() {
            let nama = document.getElementById("nama").value;
            let email = document.getElementById("email").value;
            let pass = document.getElementById("password").value;
            let feedbackElement = document.getElementById("feedback");

            // Reset pesan feedback
            feedbackElement.innerHTML = "";
            feedbackElement.style.color = "red";

            // Pengecekan data kosong
            if (nama === "" || email === "" || pass === "") {
                feedbackElement.innerHTML = "❌ **Semua *field* harus diisi!**";
            }
            // Pengecekan Panjang Password (Menggabungkan Latihan 1 dan 2)
            else if (pass.length < 8) {
                feedbackElement.innerHTML = "❌ **Kata sandi harus minimal 8 karakter!**";
            }
            else {
                feedbackElement.style.color = "green";
                feedbackElement.innerHTML = "✅ **Pendaftaran berhasil!**";
            }
        }
    </script>

</body>
</html>
