<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Latihan JavaScript Dasar</title>
</head>
<body>
  <h1>Hasil Latihan JavaScript</h1>
  <script>
  // 1. Buat array berisi 5 nama teman
let namaTeman = ["Nama", "Nama", "Nama", "Nama", "Nama"];

// 2. Tampilkan semua menggunakan perulangan for
console.log("--- Daftar Nama Teman ---");
for (let i = 0; i < namaTeman.length; i++) {
    // Menampilkan nama teman ke-(i+1)
    console.log(`Temand ke-${i + 1}: ${namaTeman[i]}`);
}
</script>
</body>
</html>
